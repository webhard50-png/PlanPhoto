# GitHub에 올리면 자동으로 APK를 빌드합니다.
# 결과: Actions 탭 → 최근 실행 → Artifacts 의 "PlanPhoto-apk" (app-debug.apk)
#       그리고 "apk" 브랜치에도 PlanPhoto.apk 로 올려 둡니다.
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PlanPhoto-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to "apk" branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/PlanPhoto.apk
          git config user.name "apk-bot"
          git config user.email "apk-bot@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf . > /dev/null
          cp /tmp/PlanPhoto.apk PlanPhoto.apk
          git add PlanPhoto.apk
          git commit -m "APK ${GITHUB_SHA::7}"
          git push -f origin apk
